<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tio Rick - Educação Financeira na Prática</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --verde-900:#0F3D24;
  --verde-700:#146B3A;
  --verde-600:#1B8A48;
  --verde-500:#25A559;
  --verde-100:#E4F5EA;
  --preto:#101214;
  --cinza-900:#1B1F22;
  --cinza-700:#3A4148;
  --cinza-500:#6B7480;
  --cinza-200:#E4E8E6;
  --cinza-100:#F3F6F4;
  --branco:#FFFFFF;
  --amarelo:#E3A73B;
  --vermelho:#D9534F;
  --font-display:'Poppins', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--cinza-100);font-family:var(--font-body);color:var(--preto);}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, var(--verde-700) 0%, var(--preto) 65%);
  padding:24px;
}
.login-card{
  background:var(--branco);border-radius:20px;padding:38px 34px 30px;
  width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,0.45);
  text-align:center;
}
.login-avatar{
  width:104px;height:104px;border-radius:50%;object-fit:cover;
  border:4px solid var(--verde-500);margin:-72px auto 14px;display:block;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);background:var(--branco);
}
.login-brand{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--verde-700);margin:0;}
.login-sub{font-size:13px;color:var(--cinza-500);margin:2px 0 22px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.field{text-align:left;margin-bottom:14px;}
.field label{font-size:12px;font-weight:700;color:var(--cinza-700);display:block;margin-bottom:5px;}
.field input, .field select{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--cinza-200);
  font-size:14px;font-family:var(--font-body);background:var(--cinza-100);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--verde-500);background:var(--branco);}
.btn{
  display:inline-block;border:none;border-radius:10px;padding:12px 18px;font-weight:700;
  font-size:14px;cursor:pointer;font-family:var(--font-body);transition:transform .08s ease, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--verde-600);color:var(--branco);width:100%;}
.btn-primary:hover{background:var(--verde-700);}
.btn-outline{background:transparent;color:var(--verde-700);border:1.5px solid var(--verde-500);width:100%;margin-top:8px;}
.btn-dark{background:var(--preto);color:var(--branco);}
.btn-small{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-danger{background:var(--vermelho);color:var(--branco);}
.login-msg{font-size:12.5px;color:var(--vermelho);font-weight:600;min-height:16px;margin-bottom:6px;}
.login-toggle{margin-top:14px;font-size:12.5px;color:var(--cinza-500);}
.login-toggle a{color:var(--verde-700);font-weight:700;cursor:pointer;text-decoration:none;}

/* ---------- APP SHELL ---------- */
.topbar{
  background:var(--preto);color:var(--branco);display:flex;align-items:center;
  justify-content:space-between;padding:12px 22px;position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--verde-500);}
.topbar-name{font-family:var(--font-display);font-weight:700;font-size:15px;}
.topbar-name span{display:block;font-size:11px;font-weight:500;color:var(--cinza-200);font-family:var(--font-body);}
.logout-btn{
  background:var(--vermelho);color:var(--branco);border:none;border-radius:8px;
  padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.logout-btn:hover{opacity:.88;}

.tabs{
  background:var(--verde-900);display:flex;overflow-x:auto;padding:0 10px;
  scrollbar-width:thin;
}
.tab-btn{
  background:transparent;border:none;color:var(--cinza-200);padding:13px 16px;
  font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;
  border-bottom:3px solid transparent;
}
.tab-btn.active{color:var(--branco);border-bottom:3px solid var(--verde-500);background:rgba(255,255,255,0.05);}
.tab-btn.teacher{color:var(--amarelo);}
.tab-btn.teacher.active{border-bottom-color:var(--amarelo);}

.content{flex:1;padding:22px;max-width:1080px;margin:0 auto;width:100%;}

.card{background:var(--branco);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(20,30,25,0.06);border:1px solid var(--cinza-200);}
.card-title{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--verde-900);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:820px){.grid-3,.grid-4{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

.subtotal-tag{background:var(--verde-100);color:var(--verde-800,#146B3A);font-weight:700;padding:6px 10px;border-radius:8px;font-size:13px;display:inline-block;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--cinza-200);font-size:13.5px;}
.list-row:last-child{border-bottom:none;}
.list-row .desc{font-weight:600;}
.list-row .meta{color:var(--cinza-500);font-size:11.5px;}
.list-row .val{font-weight:700;}
.del-btn{background:none;border:none;color:var(--vermelho);cursor:pointer;font-size:15px;padding:2px 6px;}
.badge{display:inline-block;background:var(--verde-100);color:var(--verde-700);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-right:6px;}
.small-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.small-form input, .small-form select{flex:1;min-width:100px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--cinza-200);font-size:13px;background:var(--cinza-100);}

.gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.progress-outer{background:var(--cinza-200);border-radius:20px;height:14px;width:100%;overflow:hidden;}
.progress-inner{height:100%;border-radius:20px;transition:width .3s ease;}
.stat-box{background:var(--verde-100);border-radius:12px;padding:14px 16px;text-align:center;}
.stat-box .num{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--verde-900);}
.stat-box .lbl{font-size:11.5px;color:var(--cinza-700);font-weight:600;}

.obj-card{border:1.5px solid var(--cinza-200);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.obj-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.obj-title{font-weight:700;font-size:14.5px;}
.obj-type{font-size:11px;color:var(--branco);background:var(--verde-600);padding:2px 9px;border-radius:12px;font-weight:700;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,12,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:var(--branco);border-radius:16px;padding:26px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
.modal-icon{font-size:38px;margin-bottom:6px;}
.modal-title{font-family:var(--font-display);font-weight:800;font-size:18px;margin:0 0 8px;}
.modal-text{font-size:14px;color:var(--cinza-700);margin-bottom:18px;line-height:1.5;}

.result-card{border-radius:12px;padding:16px;background:var(--verde-900);color:var(--branco);}
.result-card .num{font-family:var(--font-display);font-weight:800;font-size:22px;}
.result-card .lbl{font-size:11.5px;color:var(--cinza-200);}

.teacher-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--cinza-200);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.teacher-row:hover{border-color:var(--verde-500);background:var(--verde-100);}
.section-lbl{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--verde-700);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;}
.empty-msg{color:var(--cinza-500);font-size:13px;font-style:italic;padding:10px 0;}
.readonly-note{background:var(--amarelo);color:var(--preto);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;display:inline-block;margin-bottom:14px;}
a{color:inherit;}
.hint{font-size:11.5px;color:var(--cinza-500);margin-top:6px;}
</style>
</head>

const DEFAULT_CATEGORIAS = ["Supermercado","iFood","Farmácia","Transporte","Lazer","Educação","Saúde","Assinaturas","Outros"];

let alertQueue = [];

/* ---------- storage helpers ---------- */
async function sGet(key){
  if(!db) return null;
  try{
    const doc = await db.collection('tiorick').doc(key).get();
    return doc.exists ? doc.data().value : null;
  }catch(e){ console.error(e); return null; }
}
async function sSet(key, value){
  if(!db) return false;
  try{
    await db.collection('tiorick').doc(key).set({ value: value });
    return true;
  }catch(e){ console.error(e); return false; }
}
function safeKey(email){ return "tiorick_student_" + email.toLowerCase().trim(); }

async function getUsers(){ const u = await sGet('tiorick_users'); return u || []; }
async function saveUsers(list){ return sSet('tiorick_users', list); }
async function getStudentData(email){ return sGet(safeKey(email)); }
async function saveStudentData(email, data){ return sSet(safeKey(email), data); }

function defaultStudentData(name, email){
  return {
    profile:{name,email},
    patrimonio:{pessoal:[], familiar:[], conjuge:[]},
    despesasCategorias: DEFAULT_CATEGORIAS.slice(),
    receitas:[],
    despesas:[],
    objetivos:[],
    alertState:{ gastoMes:{mes:null, shown:{50:false,75:false,90:false}}, objetivos:{} }
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKeyOf(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function currentMonthKey(){ return todayStr().slice(0,7); }
function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0),0); }

/* ---------- render root ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.currentUser){
    app.innerHTML = screenLogin();
    return;
  }
  app.innerHTML = screenApp();
}

/* ================= LOGIN / REGISTER ================= */
function screenLogin(){
  if(state.registerMode){
    return `
    <div class="login-wrap">
      <div class="login-card">
        <img class="login-avatar" src="${AVATAR_SRC}" alt="Tio Rick"/>
        <h1 class="login-brand">Tio Rick</h1>
        <p class="login-sub">Educação Financeira na Prática</p>
        <div class="login-msg" id="loginMsg"></div>
        <div class="field"><label>Nome completo</label><input id="regNome" type="text" placeholder="Seu nome"/></div>
        <div class="field"><label>E-mail</label><input id="regEmail" type="email" placeholder="seuemail@exemplo.com"/></div>
        <div class="field"><label>Senha</label><input id="regSenha" type="password" placeholder="Crie uma senha"/></div>
        <div class="field"><label>Confirmar senha</label><input id="regSenha2" type="password" placeholder="Repita a senha"/></div>
        <button class="btn btn-primary" onclick="doRegister()">Criar minha conta</button>
        <div class="login-toggle">Já tem conta? <a onclick="toggleRegister(false)">Fazer login</a></div>
      </div>
    </div>`;
  }
  return `
  <div class="login-wrap">
    <div class="login-card">
      <img class="login-avatar" src="${AVATAR_SRC}" alt="Tio Rick"/>
      <h1 class="login-brand">Tio Rick</h1>
      <p class="login-sub">Educação Financeira na Prática</p>
      <div class="login-msg" id="loginMsg"></div>
      <div class="field"><label>E-mail</label><input id="loginEmail" type="email" placeholder="seuemail@exemplo.com"/></div>
      <div class="field"><label>Senha</label><input id="loginSenha" type="password" placeholder="Sua senha"/></div>
      <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
      <div class="login-toggle">Primeiro acesso? <a onclick="toggleRegister(true)">Cadastre-se</a></div>
    </div>
  </div>`;
}
function toggleRegister(v){ state.registerMode = v; render(); }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value;
  const msg = document.getElementById('loginMsg');
  if(!email || !senha){ msg.textContent = "Preencha e-mail e senha."; return; }
  const users = await getUsers();
  const user = users.find(u=>u.email.toLowerCase()===email);
  if(!user){ msg.textContent = "Usuário não encontrado. Cadastre-se primeiro."; return; }
  if(user.senha !== senha){ msg.textContent = "Senha incorreta."; return; }
  const isTeacher = email === TEACHER_EMAIL;
  state.currentUser = { email, name:user.nome, isTeacher };
  let data = await getStudentData(email);
  if(!data){ data = defaultStudentData(user.nome, email); await saveStudentData(email, data); }
  state.data = data;
  state.activeTab = 'inicio';
  render();
}

async function doRegister(){
  const nome = document.getElementById('regNome').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const senha = document.getElementById('regSenha').value;
  const senha2 = document.getElementById('regSenha2').value;
  const msg = document.getElementById('loginMsg');
  if(!nome || !email || !senha){ msg.textContent = "Preencha todos os campos."; return; }
  if(senha !== senha2){ msg.textContent = "As senhas não coincidem."; return; }
  const users = await getUsers();
  if(users.find(u=>u.email.toLowerCase()===email)){ msg.textContent = "Este e-mail já está cadastrado. Faça login."; return; }
  users.push({ nome, email, senha });
  await saveUsers(users);
  const isTeacher = email === TEACHER_EMAIL;
  const data = defaultStudentData(nome, email);
  await saveStudentData(email, data);
  state.data = data;
  state.currentUser = { email, name:nome, isTeacher };
  state.activeTab = 'inicio';
  state.registerMode = false;
  render();
}

function doLogout(){
  state.currentUser = null; state.data = null; state.activeTab='inicio';
  state.teacherViewing = null; state.teacherViewingData = null;
  render();
}

/* ================= APP SHELL ================= */
function screenApp(){
  const u = state.currentUser;
  const tabsList = [['inicio','Início'],['patrimonio','Patrimônio'],['financas','Receitas e Despesas'],['calculadora','Calculadora'],['objetivos','Objetivos']];
  if(u.isTeacher) tabsList.push(['professor','Painel do Professor']);

  const tabsHtml = tabsList.map(([id,label])=>{
    const cls = 'tab-btn' + (state.activeTab===id?' active':'') + (id==='professor'?' teacher':'');
    return `<button class="${cls}" onclick="switchTab('${id}')">${label}</button>`;
  }).join('');

  let body = '';
  switch(state.activeTab){
    case 'inicio': body = renderInicio(state.data); break;
    case 'patrimonio': body = renderPatrimonio(state.data, false); break;
    case 'financas': body = renderFinancas(state.data, false); break;
    case 'calculadora': body = renderCalculadora(); break;
    case 'objetivos': body = renderObjetivos(state.data, false); break;
    case 'professor': body = renderProfessor(); break;
  }

  return `
  <div class="topbar">
    <div class="topbar-left">
      <img class="topbar-avatar" src="${AVATAR_SRC}"/>
      <div class="topbar-name">${u.name}<span>${u.isTeacher?'Professor · Tio Rick':'Turma Educação Financeira na Prática'}</span></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">⏻ Sair</button>
  </div>
  <div class="tabs">${tabsHtml}</div>
  <div class="content">${body}</div>
  <div id="modalHolder"></div>
  `;
}
function switchTab(id){ state.activeTab = id; render(); if(id==='financas'){ runGastoCheck(); } }

/* ================= INÍCIO ================= */
function renderInicio(data){
  const patTotal = sum(data.patrimonio.pessoal.map(i=>i.valor)) + sum(data.patrimonio.familiar.map(i=>i.valor)) + sum(data.patrimonio.conjuge.map(i=>i.valor));
  const mk = currentMonthKey();
  const receitaMes = sum(data.receitas.filter(r=>monthKeyOf(r.data)===mk).map(r=>r.valor));
  const gastoMes = sum(data.despesas.filter(d=>monthKeyOf(d.data)===mk).map(d=>d.valor));
  const pct = receitaMes>0 ? Math.min(999,(gastoMes/receitaMes)*100) : 0;
  const objAtivos = data.objetivos.length;
  return `
  <div class="card">
    <p class="card-title">👋 Olá, ${data.profile.name.split(' ')[0]}!</p>
    <div class="grid-4">
      <div class="stat-box"><div class="num">${formatBRL(patTotal)}</div><div class="lbl">Patrimônio total</div></div>
      <div class="stat-box"><div class="num">${formatBRL(receitaMes)}</div><div class="lbl">Receita do mês</div></div>
      <div class="stat-box"><div class="num">${formatBRL(gastoMes)}</div><div class="lbl">Gasto do mês</div></div>
      <div class="stat-box"><div class="num">${objAtivos}</div><div class="lbl">Objetivos ativos</div></div>
    </div>
  </div>
  <div class="card">
    <p class="card-title">📊 Percentual da receita já comprometido este mês</p>
    ${gaugeBar(pct)}
    <p class="hint">${receitaMes<=0 ? 'Registre uma receita na aba "Receitas e Despesas" para acompanhar seu percentual gasto.' : ''}</p>
  </div>
  <div class="card">
    <p class="card-title">🎯 Seus objetivos</p>
    ${data.objetivos.length===0 ? '<p class="empty-msg">Nenhum objetivo cadastrado ainda. Vá até a aba Objetivos para adicionar.</p>' :
      data.objetivos.slice(0,3).map(o=>objetivoMini(o)).join('')}
  </div>
  `;
}
function objetivoMini(o){
  const pct = o.valorAlvo>0 ? Math.min(100,(o.valorAtual/o.valorAlvo)*100) : 0;
  return `<div style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px;">
      <span>${o.nome}</span><span>${pct.toFixed(0)}%</span>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;background:${barColor(pct,true)}"></div></div>
  </div>`;
}
function gaugeBar(pct){
  const color = barColor(pct,false);
  return `<div class="gauge-wrap">
    <div style="flex:1;">
      <div class="progress-outer"><div class="progress-inner" style="width:${Math.min(100,pct)}%;background:${color}"></div></div>
    </div>
    <div style="font-family:var(--font-display);font-weight:800;font-size:22px;color:${color};min-width:70px;text-align:right;">${pct.toFixed(0)}%</div>
  </div>`;
}
function barColor(pct, isGoal){
  if(isGoal){ // goals: closer to target = better (green)
    if(pct>=90) return 'var(--verde-600)';
    if(pct>=50) return 'var(--amarelo)';
    return 'var(--cinza-500)';
  }
  if(pct>=90) return 'var(--vermelho)';
  if(pct>=75) return 'var(--amarelo)';
  if(pct>=50) return '#4A90D9';
  return 'var(--verde-500)';
}

/* ================= PATRIMÔNIO ================= */

      items.map(i=>`<div class="list-row"><span class="desc">${i.nome}</span><span style="display:flex;align-items:center;gap:10px;"><span class="val">${formatBRL(i.valor)}</span>${readOnly?'':`<button class="del-btn" onclick="delPatrimonio('${key}','${i.id}')">✕</button>`}</span></div>`).join('')}

    <div class="small-form">

function renderPatrimonio(data, readOnly){

    ${patrimonioSection(data,'conjuge','💍 Cônjuge',readOnly)}

async function addPatrimonio(key){
  const nomeEl = document.getElementById(`pat_${key}_nome`);
  const valorEl = document.getElementById(`pat_${key}_valor`);

}
async function delPatrimonio(key,id){
  state.data.patrimonio[key] = state.data.patrimonio[key].filter(i=>i.id!==id);
  await saveStudentData(state.currentUser.email, state.data);
  render();
}

/* ================= RECEITAS E DESPESAS ================= */
function renderFinancas(data, readOnly){
  const mk = currentMonthKey();
  const receitasMes = data.receitas.filter(r=>monthKeyOf(r.data)===mk);
  const despesasMes = data.despesas.filter(d=>monthKeyOf(d.data)===mk);
  const receitaMesTotal = sum(receitasMes.map(r=>r.valor));
  const gastoMesTotal = sum(despesasMes.map(d=>d.valor));
  const pct = receitaMesTotal>0 ? (gastoMesTotal/receitaMesTotal)*100 : 0;

  const catTotals = {};
  despesasMes.forEach(d=>{ catTotals[d.categoria] = (catTotals[d.categoria]||0)+d.valor; });

  const catOptions = data.despesasCategorias.map(c=>`<option value="${c}">${c}</option>`).join('');

  return `
  ${readOnly?'<div class="readonly-note">Modo de visualização do professor — somente leitura</div>':''}
  <div class="card">
    <p class="card-title">📈 Percentual da receita já gasto no mês</p>
    ${gaugeBar(pct)}
    <div class="grid-3" style="margin-top:16px;">
      <div class="stat-box"><div class="num">${formatBRL(receitaMesTotal)}</div><div class="lbl">Receita do mês</div></div>
      <div class="stat-box"><div class="num">${formatBRL(gastoMesTotal)}</div><div class="lbl">Gasto do mês</div></div>
      <div class="stat-box"><div class="num">${formatBRL(receitaMesTotal-gastoMesTotal)}</div><div class="lbl">Saldo do mês</div></div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <p class="card-title">💵 Receitas</p>
      ${data.receitas.length===0?'<p class="empty-msg">Nenhuma receita lançada.</p>':
        data.receitas.slice().reverse().map(r=>`<div class="list-row"><span class="desc">${r.descricao}<div class="meta">${formatDate(r.data)}</div></span><span style="display:flex;align-items:center;gap:10px;"><span class="val">${formatBRL(r.valor)}</span>${readOnly?'':`<button class="del-btn" onclick="delReceita('${r.id}')">✕</button>`}</span></div>`).join('')}
      ${readOnly?'':`
      <div class="small-form">
        <input id="rec_desc" placeholder="Descrição (ex: Salário, Freelance)"/>
        <input id="rec_valor" type="number" placeholder="Valor (R$)" step="0.01"/>
        <input id="rec_data" type="date" value="${todayStr()}"/>
        <button class="btn btn-primary btn-small" onclick="addReceita()">Adicionar</button>
      </div>`}
    </div>

    <div class="card">
      <p class="card-title">🧾 Despesas</p>
      ${data.despesas.length===0?'<p class="empty-msg">Nenhuma despesa lançada.</p>':
        data.despesas.slice().reverse().slice(0,12).map(d=>`<div class="list-row"><span class="desc"><span class="badge">${d.categoria}</span>${d.descricao}<div class="meta">${formatDate(d.data)}</div></span><span style="display:flex;align-items:center;gap:10px;"><span class="val">${formatBRL(d.valor)}</span>${readOnly?'':`<button class="del-btn" onclick="delDespesa('${d.id}')">✕</button>`}</span></div>`).join('')}
      ${readOnly?'':`
      <div class="small-form">
        <select id="desp_cat">${catOptions}</select>
        <input id="desp_desc" placeholder="Descrição"/>
        <input id="desp_valor" type="number" placeholder="Valor (R$)" step="0.01"/>
        <input id="desp_data" type="date" value="${todayStr()}"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-primary btn-small" onclick="addDespesa()">Adicionar despesa</button>
      </div>
      <div class="small-form" style="margin-top:8px;">
        <input id="nova_cat_input" placeholder="Nome de uma nova categoria"/>
        <button class="btn btn-outline btn-small" style="width:auto;" onclick="addCategoria()">+ Adicionar categoria</button>
      </div>`}
    </div>
  </div>

  <div class="card">
    <p class="card-title">📂 Gastos por categoria neste mês</p>
    ${Object.keys(catTotals).length===0?'<p class="empty-msg">Sem despesas registradas neste mês.</p>':
      Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>`<div class="list-row"><span class="desc">${cat}</span><span class="val">${formatBRL(val)}</span></div>`).join('')}
  </div>
  `;
}
function formatDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }

async function addReceita(){
  const descricao = document.getElementById('rec_desc').value.trim();
  const valor = parseFloat(document.getElementById('rec_valor').value);
  const data_ = document.getElementById('rec_data').value || todayStr();
  if(!descricao || isNaN(valor)) return;
  state.data.receitas.push({id:uid(), descricao, valor, data:data_});
  await saveStudentData(state.currentUser.email, state.data);
  render();
  runGastoCheck();
}
async function delReceita(id){
  state.data.receitas = state.data.receitas.filter(r=>r.id!==id);
  await saveStudentData(state.currentUser.email, state.data);
  render();
}
async function addDespesa(){
  const categoria = document.getElementById('desp_cat').value;
  const descricao = document.getElementById('desp_desc').value.trim();
  const valor = parseFloat(document.getElementById('desp_valor').value);
  const data_ = document.getElementById('desp_data').value || todayStr();
  if(!descricao || isNaN(valor)) return;
  state.data.despesas.push({id:uid(), categoria, descricao, valor, data:data_});
  await saveStudentData(state.currentUser.email, state.data);
  render();
  runGastoCheck();
}
async function delDespesa(id){
  state.data.despesas = state.data.despesas.filter(d=>d.id!==id);
  await saveStudentData(state.currentUser.email, state.data);
  render();
}
async function addCategoria(){
  const input = document.getElementById('nova_cat_input');
  const trimmed = input.value.trim();
  if(!trimmed) return;
  if(!state.data.despesasCategorias.includes(trimmed)){
    state.data.despesasCategorias.push(trimmed);
    await saveStudentData(state.currentUser.email, state.data);
  }
  render();
}

async function runGastoCheck(){
  const data = state.data;
  if(!data) return;
  const mk = currentMonthKey();
  if(data.alertState.gastoMes.mes !== mk){
    data.alertState.gastoMes = {mes:mk, shown:{50:false,75:false,90:false}};
  }
  const receitaMes = sum(data.receitas.filter(r=>monthKeyOf(r.data)===mk).map(r=>r.valor));
  const gastoMes = sum(data.despesas.filter(d=>monthKeyOf(d.data)===mk).map(d=>d.valor));
  if(receitaMes<=0) return;
  const pct = (gastoMes/receitaMes)*100;
  let changed = false;
  [90,75,50].forEach(th=>{
    if(pct>=th && !data.alertState.gastoMes.shown[th]){
      data.alertState.gastoMes.shown[th]=true;
      changed = true;
      queueAlert(gastoAlertHtml(th,pct));
    }
  });
  if(changed) await saveStudentData(state.currentUser.email, data);
}
function gastoAlertHtml(th,pct){
  const cor = th>=90?'var(--vermelho)':(th>=75?'var(--amarelo)':'#4A90D9');
  const icon = th>=90?'🚨':(th>=75?'⚠️':'📌');
  const texto = th>=90 ? 'Atenção! Você já comprometeu 90% ou mais da sua receita mensal com despesas. Revise seus gastos com cuidado.'
    : th>=75 ? 'Você já gastou 75% ou mais da sua receita mensal. Fique de olho no que ainda falta no mês.'
    : 'Você já gastou 50% ou mais da sua receita mensal. Um bom momento para planejar o restante do mês.';
  return `<div class="modal-icon">${icon}</div><h3 class="modal-title" style="color:${cor}">Alerta de gastos: ${th}%</h3><p class="modal-text">${texto}<br><br>Percentual atual: <b>${pct.toFixed(1)}%</b> da receita do mês.</p>`;
}

/* ================= CALCULADORA ================= */
function renderCalculadora(){
  return `
  <div class="card">
    <p class="card-title">🧮 Calculadora de Investimentos</p>
    <p class="hint">Índices de referência (julho/2026): CDI ${TAXAS_REF.cdi}% a.a. · Selic ${TAXAS_REF.selic}% a.a. · IPCA ${TAXAS_REF.ipca}% a.a. · Poupança ${TAXAS_REF.poupanca}% a.a. Ajuste conforme boletins mais recentes.</p>
    <div class="grid-3" style="margin-top:14px;">
      <div class="field"><label>Capital inicial (R$)</label><input id="calc_capital" type="number" value="1000" step="0.01"/></div>
      <div class="field"><label>Aporte mensal (R$)</label><input id="calc_aporte" type="number" value="200" step="0.01"/></div>
      <div class="field"><label>Prazo (meses)</label><input id="calc_prazo" type="number" value="12" step="1"/></div>
    </div>
    <p class="section-lbl" style="margin-top:6px;">Compare até duas opções de investimento</p>
    <div class="grid-2">
      <div class="field">
        <label>Investimento A</label>
        <select id="calc_taxaA" onchange="toggleCustom('A')">
          <option value="cdi">CDI (${TAXAS_REF.cdi}% a.a.)</option>
          <option value="selic">Selic (${TAXAS_REF.selic}% a.a.)</option>
          <option value="ipca">IPCA (${TAXAS_REF.ipca}% a.a.)</option>
          <option value="poupanca">Poupança (${TAXAS_REF.poupanca}% a.a.)</option>
          <option value="custom">Personalizada</option>
        </select>
        <input id="calc_customA" type="number" placeholder="Taxa anual % personalizada" style="display:none;margin-top:8px;"/>
      </div>
      <div class="field">
        <label>Investimento B</label>
        <select id="calc_taxaB" onchange="toggleCustom('B')">
          <option value="selic">Selic (${TAXAS_REF.selic}% a.a.)</option>
          <option value="cdi">CDI (${TAXAS_REF.cdi}% a.a.)</option>
          <option value="ipca">IPCA (${TAXAS_REF.ipca}% a.a.)</option>
          <option value="poupanca">Poupança (${TAXAS_REF.poupanca}% a.a.)</option>
          <option value="custom">Personalizada</option>
        </select>
        <input id="calc_customB" type="number" placeholder="Taxa anual % personalizada" style="display:none;margin-top:8px;"/>
      </div>
    </div>
    <button class="btn btn-primary" style="width:auto;padding:12px 26px;" onclick="calcular()">Calcular e comparar</button>
    <div id="calcResultado" class="grid-2" style="margin-top:18px;"></div>
  </div>`;
}
function toggleCustom(letra){
  const sel = document.getElementById('calc_taxa'+letra).value;
  document.getElementById('calc_custom'+letra).style.display = sel==='custom' ? 'block' : 'none';
}
function taxaAnualDe(letra){
  const sel = document.getElementById('calc_taxa'+letra).value;
  if(sel==='custom'){ return parseFloat(document.getElementById('calc_custom'+letra).value) || 0; }
  return TAXAS_REF[sel];
}
function investResult(capital, aporte, meses, taxaAnual){
  const rm = Math.pow(1+taxaAnual/100, 1/12) - 1;
  let saldo = capital;
  for(let i=0;i<meses;i++){ saldo = saldo*(1+rm) + aporte; }
  const totalInvestido = capital + aporte*meses;
  const juros = saldo - totalInvestido;
  return { saldo, totalInvestido, juros };
}
function calcular(){
  const capital = parseFloat(document.getElementById('calc_capital').value)||0;
  const aporte = parseFloat(document.getElementById('calc_aporte').value)||0;
  const meses = parseInt(document.getElementById('calc_prazo').value)||0;
  const taxaA = taxaAnualDe('A'), taxaB = taxaAnualDe('B');
  const rA = investResult(capital,aporte,meses,taxaA);
  const rB = investResult(capital,aporte,meses,taxaB);
  const box = (label, taxa, r) => `
    <div class="result-card">
      <div class="lbl">${label} · taxa ${taxa.toFixed(2)}% a.a.</div>
      <div class="num">${formatBRL(r.saldo)}</div>
      <div class="lbl" style="margin-top:8px;">Total investido: ${formatBRL(r.totalInvestido)}</div>
      <div class="lbl">Juros ganhos: ${formatBRL(r.juros)}</div>
    </div>`;
  document.getElementById('calcResultado').innerHTML = box('Investimento A',taxaA,rA) + box('Investimento B',taxaB,rB);
}

/* ================= OBJETIVOS ================= */
function renderObjetivos(data, readOnly){
  return `
  ${readOnly?'<div class="readonly-note">Modo de visualização do professor — somente leitura</div>':''}
  <div class="card">
    <p class="card-title">🎯 Meus Objetivos</p>
    ${data.objetivos.length===0?'<p class="empty-msg">Nenhum objetivo cadastrado ainda.</p>':
      data.objetivos.map(o=>objetivoCard(o,readOnly)).join('')}
    ${readOnly?'':`

    <div class="small-form">
      <input id="obj_nome" placeholder="Nome (ex: Viagem para o Nordeste)"/>
      <select id="obj_tipo">
        <option value="Viagem">Viagem</option>
        <option value="Aquisição">Aquisição</option>
        <option value="Pessoal">Pessoal</option>
      </select>
      <input id="obj_alvo" type="number" placeholder="Valor alvo (R$)" step="0.01"/>

      <button class="btn btn-primary btn-small" onclick="addObjetivo()">Adicionar</button>
    </div>`}

function objetivoCard(o, readOnly){
  const pct = o.valorAlvo>0 ? Math.min(100,(o.valorAtual/o.valorAlvo)*100) : 0;
  return `<div class="obj-card">
    <div class="obj-head">
      <span class="obj-title">${o.nome} <span class="obj-type">${o.tipo}</span></span>
      ${readOnly?'':`<button class="del-btn" onclick="delObjetivo('${o.id}')">✕</button>`}
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;background:${barColor(pct,true)}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--cinza-700);">
      <span>${formatBRL(o.valorAtual)} guardado</span><span>${formatBRL(o.valorAlvo)} meta · ${pct.toFixed(0)}%</span>
    </div>
    ${readOnly?'':`<div class="small-form" style="margin-top:10px;">
      <input id="obj_add_${o.id}" type="number" placeholder="Valor a guardar (R$)" step="0.01"/>
      <button class="btn btn-outline btn-small" style="width:auto;" onclick="atualizarObjetivo('${o.id}')">Guardar mais dinheiro</button>
    </div>`}
  </div>`;
}
async function addObjetivo(){
  const nome = document.getElementById('obj_nome').value.trim();
  const tipo = document.getElementById('obj_tipo').value;
  const valorAlvo = parseFloat(document.getElementById('obj_alvo').value);
  const valorAtualInput = document.getElementById('obj_atual').value;
  const valorAtual = valorAtualInput ? (parseFloat(valorAtualInput)||0) : 0;
  if(!nome || isNaN(valorAlvo)) return;
  const id = uid();
  const obj = {id, nome, tipo, valorAlvo, valorAtual};
  state.data.objetivos.push(obj);
  state.data.alertState.objetivos[id] = {50:false,75:false,90:false};
  const pct = valorAlvo>0 ? (valorAtual/valorAlvo*100) : 0;
  [90,75,50].forEach(th=>{
    if(pct>=th && !state.data.alertState.objetivos[id][th]){
      state.data.alertState.objetivos[id][th]=true;
      queueAlert(objetivoAlertHtml(th,obj));
    }
  });
  await saveStudentData(state.currentUser.email, state.data);
  render();
}
async function delObjetivo(id){
  state.data.objetivos = state.data.objetivos.filter(o=>o.id!==id);
  delete state.data.alertState.objetivos[id];
  await saveStudentData(state.currentUser.email, state.data);
  render();
}
async function atualizarObjetivo(id){
  const input = document.getElementById('obj_add_'+id);
  const num = parseFloat(input.value);
  if(isNaN(num) || num<=0) return;
  const obj = state.data.objetivos.find(o=>o.id===id);
  obj.valorAtual += num;
  if(!state.data.alertState.objetivos[id]) state.data.alertState.objetivos[id]={50:false,75:false,90:false};
  const pct = obj.valorAlvo>0 ? (obj.valorAtual/obj.valorAlvo*100) : 0;
  [90,75,50].forEach(th=>{
    if(pct>=th && !state.data.alertState.objetivos[id][th]){
      state.data.alertState.objetivos[id][th]=true;
      queueAlert(objetivoAlertHtml(th,obj));
    }
  });
  await saveStudentData(state.currentUser.email, state.data);
  render();
}
function objetivoAlertHtml(th,obj){
  const texto = th>=90 ? `Uau! Você já alcançou ${th}% ou mais da meta "${obj.nome}". Está quase lá!`
    : th>=75 ? `Muito bem! Você já alcançou ${th}% ou mais da meta "${obj.nome}". Continue assim!`
    : `Parabéns! Você já alcançou ${th}% ou mais da meta "${obj.nome}". Metade do caminho percorrido!`;
  return `<div class="modal-icon">🎉</div><h3 class="modal-title" style="color:var(--verde-700)">Meta em progresso: ${th}%</h3><p class="modal-text">${texto}</p>`;
}

/* ================= PROFESSOR ================= */
function renderProfessor(){
  if(state.teacherViewing && state.teacherViewingData){
    const d = state.teacherViewingData;
    return `
    <div class="card">
      <button class="btn btn-dark btn-small" style="width:auto;" onclick="teacherBack()">← Voltar para a lista de alunos</button>
      <p class="card-title" style="margin-top:14px;">👤 ${d.profile.name} <span style="font-weight:400;font-size:12px;color:var(--cinza-500);">(${d.profile.email})</span></p>
    </div>
    ${renderPatrimonio(d, true)}
    ${renderFinancas(d, true)}
    ${renderObjetivos(d, true)}
    `;
  }
  return `<div class="card"><p class="card-title">👨‍🏫 Painel do Professor</p><p class="hint">Selecione um aluno para visualizar todo o conteúdo lançado por ele (patrimônio, receitas, despesas e objetivos).</p>
  <div id="teacherList" style="margin-top:14px;">Carregando alunos...</div></div>`;
}
async function loadTeacherList(){
  const holder = document.getElementById('teacherList');
  if(!holder) return;
  const users = await getUsers();
  const alunos = users.filter(u=>u.email.toLowerCase()!==TEACHER_EMAIL);
  if(alunos.length===0){ holder.innerHTML = '<p class="empty-msg">Nenhum aluno cadastrado ainda.</p>'; return; }
  holder.innerHTML = alunos.map(a=>`<div class="teacher-row" onclick="teacherView('${a.email}')"><span><b>${a.nome}</b><br><span style="font-size:12px;color:var(--cinza-500);">${a.email}</span></span><span>›</span></div>`).join('');
}
async function teacherView(email){
  const d = await getStudentData(email);
  state.teacherViewing = email;
  state.teacherViewingData = d || defaultStudentData(email, email);
  render();
}
function teacherBack(){ state.teacherViewing = null; state.teacherViewingData = null; render(); }

/* ================= ALERT MODAL QUEUE ================= */
function queueAlert(html){ alertQueue.push(html); if(alertQueue.length===1) showModal(); }
function showModal(){
  const holder = document.getElementById('modalHolder');
  if(!holder || alertQueue.length===0) return;
  holder.innerHTML = `<div class="modal-overlay"><div class="modal-box">${alertQueue[0]}<button class="btn btn-primary" onclick="closeModal()">Entendi</button></div></div>`;
}
function closeModal(){
  alertQueue.shift();
  const holder = document.getElementById('modalHolder');
  if(holder) holder.innerHTML = '';
  if(alertQueue.length>0) setTimeout(showModal,150);
}

/* hook: whenever we re-render professor list view, reload it */
const _origRender = render;
render = function(){
  _origRender();
  if(state.currentUser && state.currentUser.isTeacher && state.activeTab==='professor' && !state.teacherViewing){
    loadTeacherList();
  }
  if(state.currentUser && state.activeTab==='financas'){
    runGastoCheck();
  }
};

/* ================= INIT ================= */
function boot(){
  if(!firebaseReady){
    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <h1 class="login-brand" style="color:var(--vermelho);">Configuração pendente</h1>
          <p class="login-sub" style="text-transform:none;">Este aplicativo ainda não foi conectado a um banco de dados.</p>
          <p class="hint" style="text-align:left;">Abra o arquivo HTML, localize o bloco "firebaseConfig" no topo do código e cole os dados do seu projeto Firebase, seguindo o passo a passo que o professor recebeu. Depois é só salvar e publicar novamente.</p>
        </div>
      </div>`;
    return;
  }
  render();
}
boot();
</script>
